[package]
name = "lider"
description = "LID, Linux Internet Downloader: multi-connection download manager for Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "lider"

[[bin]]
name = "lider"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = "0.4"
encoding_rs = "0.8"
indexmap = { workspace = true, features = ["serde"] }
lider-core.workspace = true
lider-sys.workspace = true
mime_guess = "2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
trash = "5"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[dev-dependencies]
tempfile = "3"
