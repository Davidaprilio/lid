[workspace]
resolver = "3"
members = ["crates/lider-core", "crates/lider-sys", "src-tauri"]

[workspace.package]
# The only place the version of LID 2 is set. src-tauri/tauri.conf.json, build.sh and CI read it from here.
version = "2.0.0-beta.1"
edition = "2024"
license = "MIT"
authors = ["David Aprilio"]
repository = "https://github.com/Davidaprilio/lid"
rust-version = "1.90"

[workspace.dependencies]
lider-core = { path = "crates/lider-core" }
lider-sys = { path = "crates/lider-sys" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
