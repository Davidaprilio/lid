name: Build packages

# Push a tag like v2.0.0 (matching the version in Cargo.toml) to build every package and publish a release.
# "Run workflow" on the Actions tab builds the packages without publishing anything.
# Optional repository secrets AMO_JWT_ISSUER / AMO_JWT_SECRET sign the Firefox add-on on tag pushes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # System libraries Tauri builds against (WebKitGTK, GTK, tray, SVG).
  TAURI_DEPS: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TAURI_DEPS ffmpeg
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --locked
      - name: Browser extension tests
        run: node --test tests/js/capture.test.cjs

  # The AppImage and the .deb are built on the oldest supported Ubuntu, so they run on newer systems too.
  appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TAURI_DEPS file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo install tauri-cli --version "~2.12" --locked
      - name: Build (signed for the updater on tag pushes)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./packaging/build.sh appimage
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sig
          if-no-files-found: error

  # The per-user Windows installer (docs/platforms.md), signed for the updater on tag pushes.
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm --dir ui install --frozen-lockfile
      - run: cargo install tauri-cli --version "~2.12" --locked
      - name: Installer (NSIS)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          signed=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && signed=true
          cargo tauri build --bundles nsis --config "{\"bundle\":{\"createUpdaterArtifacts\":$signed}}"
          mkdir -p dist
          cp target/release/bundle/nsis/*-setup.exe "dist/LID-$version-x64-setup.exe"
          if [ "$signed" = true ]; then cp target/release/bundle/nsis/*-setup.exe.sig "dist/LID-$version-x64-setup.exe.sig"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  deb:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TAURI_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: ./packaging/build.sh deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  arch:
    needs: test
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo rust nodejs pnpm \
            webkit2gtk-4.1 gtk3 libayatana-appindicator
      - uses: actions/checkout@v4
      - name: Arch package and AUR files
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          sudo -u builder ./packaging/build.sh arch
          sudo -u builder env AUR_SOURCE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/lider-$version.tar.gz" \
            ./packaging/build.sh aur
          tar -czf "dist/lider-$version-aur.tar.gz" -C dist/aur PKGBUILD .SRCINFO
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: |
            dist/*.pkg.tar.zst
            dist/lider-*.tar.gz
          if-no-files-found: error

  extension:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (and sign the Firefox add-on on tag pushes)
        env:
          # AMO signs each version only once, so manual runs never sign.
          AMO_JWT_ISSUER: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AMO_JWT_ISSUER || '' }}
          AMO_JWT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.AMO_JWT_SECRET || '' }}
        run: ./packaging/build.sh extension
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            dist/lid-extension-*
            dist/firefox-updates.json
          if-no-files-found: error

  release:
    needs: [appimage, windows, deb, arch, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater manifest (latest.json)
        # Read by LID's updater (src-tauri/src/update.rs): each signed file with its signature.
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          python3 - "$version" "$base" <<'PY'
          import json, sys, datetime, pathlib
          version, base = sys.argv[1], sys.argv[2]
          files = {"linux-x86_64": f"Lider-{version}-x86_64.AppImage", "windows-x86_64": f"LID-{version}-x64-setup.exe"}
          platforms = {}
          for key, name in files.items():
              sig = pathlib.Path("dist") / f"{name}.sig"
              if sig.is_file():
                  platforms[key] = {"signature": sig.read_text().strip(), "url": f"{base}/{name}"}
          if platforms:
              doc = {"version": version, "notes": "", "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"), "platforms": platforms}
              pathlib.Path("dist/latest.json").write_text(json.dumps(doc, indent=2) + "\n")
              print(json.dumps(doc, indent=2))
          else:
              print("no signatures (TAURI_SIGNING_PRIVATE_KEY not set): no latest.json")
          PY
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # An existing release (a draft made beforehand with gh release create vX --draft, or a tag
        # that was moved) only gets its files replaced; a draft stays a draft. A version with a "-"
        # (2.0.0-alpha.1) is published as a pre-release.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            pre=()
            case "$GITHUB_REF_NAME" in *-*) pre=(--prerelease) ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* "${pre[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LID ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
