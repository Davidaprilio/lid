name: Rust port

# Checks for the Rust + Tauri port (docs/tauri/PLAN.md). Runs next to the Python tests until the cut-over.
on:
  push:
    branches: [tauri]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri (WebKitGTK, tray, SVG)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev ffmpeg xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Frontend
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui check
          pnpm --dir ui build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Golden 1.2 profile is what the Python code writes
        run: |
          python3 tests/golden/make_golden.py
          git diff --exit-code -- tests/golden/v1.2 ':!*.db'  # SQLite bytes differ between SQLite versions
      - name: 1.2 can read what the port writes (downgrade)
        run: |
          LIDER_GOLDEN_OUT="$RUNNER_TEMP/rust-profile" cargo test -p lider-core --test golden --locked
          python3 tests/golden/check_rust_profile.py "$RUNNER_TEMP/rust-profile"
      - name: UI scenarios in the real window
        run: |
          cargo install tauri-cli --version "^2" --locked
          xvfb-run -a tests/e2e/run.sh
      - name: Parity progress
        run: ./docs/tauri/parity-progress.sh >> "$GITHUB_STEP_SUMMARY"
