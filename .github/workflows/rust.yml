name: Rust

# Checks for LID 2 (crates/: lider-core, lider-sys, lider-gui). Runs next to the Python tests of 1.x.
on:
  push:
    branches: [tauri, ports, egui]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools for the tests (ffmpeg for media, CJK fonts for the window's file names)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The window's tests (egui_kittest) need no display.
      - run: cargo test --workspace --locked
      - name: Golden 1.2 profile is what the Python code writes
        run: |
          python3 tests/golden/make_golden.py
          git diff --exit-code -- tests/golden/v1.2 ':!*.db'  # SQLite bytes differ between SQLite versions
      - name: 1.2 can read what the port writes (downgrade)
        run: |
          LIDER_GOLDEN_OUT="$RUNNER_TEMP/rust-profile" cargo test -p lider-core --test golden --locked
          python3 tests/golden/check_rust_profile.py "$RUNNER_TEMP/rust-profile"
      - name: Parity progress
        run: ./docs/tauri/parity-progress.sh docs/egui/parity >> "$GITHUB_STEP_SUMMARY"

  # Windows (docs/platforms.md): the adapter's tests, and the program with its per-user installer, which is
  # kept as an artifact to try on a Windows machine.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lider-core -p lider-sys --locked
      - run: cargo clippy -p lider-sys -p lider-gui --all-targets --locked -- -D warnings
      - name: NSIS
        run: command -v makensis || choco install nsis -y --no-progress
      - name: Installer
        run: |
          PATH="$PATH:/c/Program Files (x86)/NSIS"
          ./packaging/build.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
