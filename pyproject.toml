[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lider"
dynamic = ["version"]
description = "LID, Linux Internet Downloader: multi-connection download manager for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
youtube = ["yt-dlp>=2026.8.19"]

[project.scripts]
lider = "lider.app:main"

[tool.setuptools.dynamic]
version = {attr = "lider.__version__"}  # one place for the version: lider/__init__.py

[tool.setuptools.packages.find]
include = ["lider*"]

[tool.setuptools.package-data]
lider = ["ui/assets/icons/*.svg", "browser_extension/*", "browser_extension/icons/*"]
