[package]
name = "lider-core"
description = "LID core: engine, manager, queues, scheduler, store and settings. No GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
md-5 = "0.10"
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "socks", "system-proxy", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
tokio-util = "0.7"
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
encoding_rs = "0.8"
url = "2"
percent-encoding = "2"
suppaftp = { version = "12", features = ["tokio"] }
scraper = "0.29.0"
ego-tree = "0.11.1"

[dev-dependencies]
tempfile = "3"
