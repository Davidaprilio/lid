[package]
name = "lider-gui"
description = "LID's window, drawn with egui (docs/egui/PLAN.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# `lider-egui` until the cut-over from the Tauri window, then `lider`.
[[bin]]
name = "lider-egui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
include_dir = "0.7"
lider-core.workspace = true
lider-sys.workspace = true
serde_json.workspace = true
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
trash = "5"
encoding_rs = "0.8"

# The tray icon: StatusNotifierItem over D-Bus on Linux (no GTK), the shell icon on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
