[package]
name = "lider-gui"
description = "LID, Linux Internet Downloader: multi-connection download manager"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "lider"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "default_fonts"] }
egui = "0.37"
egui_extras = { version = "0.37", features = ["svg"] }
include_dir = "0.7"
lider-core.workspace = true
lider-sys.workspace = true
serde_json.workspace = true
rfd = "0.15"
tokio = { version = "1", features = ["rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
notify-rust = "4"
image = { version = "0.25", default-features = false, features = ["png"] }
trash = "5"
mime_guess = "2"
encoding_rs = "0.8"

# The tray icon: StatusNotifierItem over D-Bus on Linux (no GTK), the shell icon on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"

# The program's icon and version in the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
egui_kittest = "0.37"
tempfile = "3"
minisign = "0.7"
base64 = "0.22"
