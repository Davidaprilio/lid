[package]
name = "lider-sys"
description = "LID and the operating system: single instance, native messaging host, browser setup, desktop entries and services, behind per-OS ports. No GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
include_dir = "0.7"
lider-core.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
shlex = "1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

# The Linux adapter (platform/linux).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
